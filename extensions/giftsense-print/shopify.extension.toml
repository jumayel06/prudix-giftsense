api_version = "2026-07"

# Shopify allows one print target per extension, so the order page and the
# orders list are two extensions sharing the same module.

# Order details → Print → "GiftSense gift cards" (cards and/or gift receipt).
[[extensions]]
name = "GiftSense gift cards"
handle = "giftsense-print"
uid = "e395c2e1-3fc2-003b-2329-5cdd53d346b2e46de0f0"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/PrintAction.jsx"
target = "admin.order-details.print-action.render"

# Orders list → select orders → Print → same, for up to 50 orders.
[[extensions]]
name = "GiftSense gift cards (bulk)"
handle = "giftsense-print-bulk"
uid = "128934c2-1bec-88a0-1e41-7ee42138bb02ebdcc7a5"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/PrintAction.jsx"
target = "admin.order-index.selection-print-action.render"
