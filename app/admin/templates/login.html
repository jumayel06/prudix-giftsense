<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · GiftSense admin</title>
  <style>
    :root { --navy:#0f172a; --gold:#eab308; --slate:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --err:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; padding:16px; }
    .card { width:100%; max-width:360px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
    h1 { margin:0 0 4px; font-size:20px; color:var(--navy); }
    h1 span { color:var(--gold); }
    p.sub { margin:0 0 20px; color:var(--slate); font-size:14px; }
    label { display:block; font-size:13px; font-weight:600; color:var(--navy); margin:14px 0 6px; }
    input { width:100%; font-size:16px; /* 16px stops iOS zooming on focus */
            padding:11px 12px; border:1px solid #cbd5e1; border-radius:8px; color:var(--navy); background:#fff; }
    input:focus { outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold); }
    button { width:100%; margin-top:22px; padding:12px; font-size:16px; font-weight:600; border:0; border-radius:8px;
             background:var(--navy); color:#fff; cursor:pointer; }
    .error { margin:0 0 4px; padding:10px 12px; border-radius:8px; background:#fef2f2; color:var(--err); font-size:14px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ admin_path }}/login" autocomplete="on">
    <h1><span>GiftSense</span> admin</h1>
    <p class="sub">Sign in to continue.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus
           autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    {% if totp_enabled %}
    <label for="code">Authenticator code</label>
    <input id="code" name="code" type="text" required inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7"
           autocomplete="one-time-code" placeholder="123 456">
    {% endif %}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
