<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GiftSense admin{% endblock %}</title>

  <!-- Match the merchant dashboard + marketing site typography.
       Inter for body, Poppins for the wordmark + headings. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://rsms.me/inter/inter.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Brand palette — mirrors prudix-website global.css.
         Any color change here should also happen there so the admin
         and marketing site stay visually locked. */
      --navy-900:   #0f172a;
      --navy-800:   #1e293b;
      --navy-700:   #334155;
      --slate-600:  #475569;
      --slate-500:  #64748b;
      --slate-400:  #94a3b8;
      --slate-300:  #cbd5e1;
      --slate-200:  #e2e8f0;
      --slate-100:  #f1f5f9;
      --slate-50:   #f8fafc;
      --white:      #ffffff;

      --brand:         #eab308;   /* yellow-500 — CTAs, chips, focus */
      --brand-soft:    #a16207;   /* yellow-700 — text accents on white */
      --brand-deep:    #854d0e;   /* yellow-800 — hover */
      --brand-glow:    rgba(234, 179, 8, 0.32);

      --accent-indigo:   #6366f1;
      --accent-emerald:  #10b981;
      --accent-rose:     #ef4444;
      --accent-sky:      #0ea5e9;
      --accent-violet:   #8b5cf6;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow:    0 1px 3px rgba(15, 23, 42, 0.05), 0 4px 16px -4px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 4px 8px rgba(15, 23, 42, 0.05), 0 16px 40px -8px rgba(15, 23, 42, 0.1);

      --radius-sm: 8px;
      --radius:    12px;
      --radius-lg: 20px;

      /* ── Legacy aliases (kept so existing overview/financials/shops
             /shop_detail templates that use var(--border) etc. keep working
             without touching every file). New templates should prefer the
             brand palette vars above. ─────────────────────────────── */
      --bg:              var(--slate-50);
      --surface:         var(--white);
      --border:          var(--slate-200);
      --border-strong:   var(--slate-300);
      --text:            var(--navy-900);
      --text-muted:      var(--slate-500);
      --text-faint:      var(--slate-400);
      --primary:         var(--brand);
      --positive:        #16a34a;
      --warning:         #ea580c;
      --critical:        #dc2626;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--slate-50);
      color: var(--navy-900);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--brand-soft); text-decoration: none; font-weight: 500; }
    a:hover { color: var(--brand-deep); text-decoration: underline; }

    /* ── Layout ─────────────────────────────────────────────── */

    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
      color: var(--slate-100);
      padding: 24px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: sticky; top: 0; height: 100vh;
    }

    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 8px; margin-bottom: 4px;
    }
    .sidebar-brand svg { width: 32px; height: 32px; flex-shrink: 0; }
    .sidebar-brand .wordmark {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--white);
      background: linear-gradient(110deg, #cbd5e1 0%, #94a3b8 55%, #eab308 100%);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-brand .wordmark sup {
      font-size: 11px; font-weight: 600; margin-left: 2px;
    }
    .sidebar-badge {
      display: inline-block;
      padding: 3px 9px;
      margin: 4px 8px 0;
      border-radius: 999px;
      background: rgba(234, 179, 8, 0.14);
      color: var(--brand);
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      width: fit-content;
    }

    .sidebar nav {
      margin-top: 32px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar nav a {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      color: var(--slate-300);
      font-weight: 500;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar nav a:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--white);
      text-decoration: none;
    }
    .sidebar nav a.active {
      background: linear-gradient(135deg, var(--brand) 0%, #ca8a04 100%);
      color: var(--navy-900);
      font-weight: 700;
      box-shadow: 0 4px 14px -4px var(--brand-glow);
    }
    .sidebar nav a.active:hover { color: var(--navy-900); }
    .sidebar nav a.external { color: var(--slate-400); }

    .sidebar footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px; color: var(--slate-400);
      line-height: 1.7;
    }
    .sidebar footer .env-chip {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.08); color: var(--white);
      font-weight: 600; font-size: 11px; letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;
      padding: 40px 48px;
      overflow-x: auto;
      background:
        radial-gradient(ellipse 80% 40% at 100% 0%, rgba(234, 179, 8, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 0% 100%, rgba(99, 102, 241, 0.04) 0%, transparent 60%),
        var(--slate-50);
      min-height: 100vh;
    }

    /* ── Titles ─────────────────────────────────────────────── */

    .page-title {
      font-family: 'Poppins', sans-serif;
      font-size: 32px; font-weight: 800;
      letter-spacing: -0.03em; line-height: 1.15;
      margin: 0 0 8px 0;
      color: var(--navy-900);
    }
    .page-subtitle {
      color: var(--slate-500);
      font-size: 16px;
      margin: 0 0 32px 0;
      max-width: 720px;
    }

    /* ── Grids ──────────────────────────────────────────────── */

    .grid { display: grid; gap: 20px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1200px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .main { padding: 24px 20px; }
    }

    /* ── Cards ──────────────────────────────────────────────── */

    .card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      padding: 24px 26px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      border-color: var(--slate-300);
    }

    /* Tonal KPI cards — gradient tint bg + colored left accent bar.
       Each variant sets the CSS custom property `--accent`; the ::before
       overlay + subtle radial-gradient background pick it up so the card
       reads "brand-yellow / emerald / rose / etc." at a glance. */
    .card-brand   { --accent: var(--brand);          --tint: rgba(234,179,8,0.08); }
    .card-emerald { --accent: var(--accent-emerald); --tint: rgba(16,185,129,0.08); }
    .card-rose    { --accent: var(--accent-rose);    --tint: rgba(239,68,68,0.08);  }
    .card-indigo  { --accent: var(--accent-indigo);  --tint: rgba(99,102,241,0.08); }
    .card-sky     { --accent: var(--accent-sky);     --tint: rgba(14,165,233,0.08); }
    .card-violet  { --accent: var(--accent-violet);  --tint: rgba(139,92,246,0.08); }

    .card-brand, .card-emerald, .card-rose,
    .card-indigo, .card-sky, .card-violet {
      background:
        radial-gradient(ellipse 90% 60% at 100% 0%, var(--tint) 0%, transparent 70%),
        var(--white);
      border-color: transparent;
      box-shadow: inset 4px 0 0 var(--accent), var(--shadow-sm);
    }
    .card-brand:hover, .card-emerald:hover, .card-rose:hover,
    .card-indigo:hover, .card-sky:hover, .card-violet:hover {
      box-shadow: inset 4px 0 0 var(--accent), var(--shadow-lg);
    }

    .card-title {
      font-size: 12px; color: var(--slate-500);
      text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 700; margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .card-title .card-title-icon {
      width: 14px; height: 14px; opacity: 0.7;
    }
    .kpi-value {
      font-family: 'Poppins', sans-serif;
      font-size: 36px; font-weight: 800;
      letter-spacing: -0.035em; line-height: 1.05;
      color: var(--navy-900);
    }
    .kpi-value.brand   { color: var(--brand-soft); }
    .kpi-value.emerald { color: #047857; }
    .kpi-value.rose    { color: #b91c1c; }
    .kpi-value.indigo  { color: var(--accent-indigo); }
    .kpi-value.sky     { color: #0369a1; }
    .kpi-value.violet  { color: #7c3aed; }
    .kpi-sub {
      font-size: 13px; color: var(--slate-500); margin-top: 8px;
      line-height: 1.5;
    }
    .kpi-sub strong { color: var(--navy-800); font-weight: 600; }

    /* ── Sections ───────────────────────────────────────────── */

    .section { margin-top: 56px; }
    .section h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px 0;
      color: var(--navy-900);
      display: flex; align-items: baseline; gap: 10px;
    }
    .section h2::before {
      content: '';
      display: inline-block;
      width: 4px; height: 20px;
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-deep) 100%);
      border-radius: 2px;
      margin-right: 2px;
      transform: translateY(3px);
    }
    .section > p:first-of-type {
      color: var(--slate-500);
      font-size: 14px;
      margin: 0 0 20px 14px;
      max-width: 640px;
    }

    /* ── Tables ─────────────────────────────────────────────── */

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      font-size: 14px;
    }
    th, td { text-align: left; padding: 14px 18px; }
    th {
      background: var(--slate-50);
      font-weight: 700; color: var(--slate-500);
      text-transform: uppercase; font-size: 11px;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--slate-200);
      white-space: nowrap;
    }
    td { border-bottom: 1px solid var(--slate-100); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--slate-50); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    /* ── Pills / badges ─────────────────────────────────────── */

    .pill {
      display: inline-block; padding: 3px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    }
    .pill-active     { background: #dcfce7; color: #166534; }
    .pill-trial      { background: #fef3c7; color: #92400e; }
    .pill-cancelled  { background: #fee2e2; color: #991b1b; }
    .pill-expired    { background: #fee2e2; color: #991b1b; }
    .pill-pending    { background: #e0e7ff; color: #3730a3; }
    .pill-uninstalled{ background: var(--slate-100); color: var(--slate-500); }
    .pill-declined   { background: #ffedd5; color: #9a3412; }
    .pill-locked     { background: #fee2e2; color: #991b1b; }
    .pill-neutral    { background: var(--slate-100); color: var(--slate-600); }
    .pill-brand      { background: #fefce8; color: var(--brand-deep); }

    .text-positive { color: #16a34a; font-weight: 600; }
    .text-warning  { color: #ea580c; font-weight: 600; }
    .text-critical { color: #dc2626; font-weight: 600; }
    .text-muted    { color: var(--slate-500); }
    .text-faint    { color: var(--slate-400); }
    .mono {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    /* ── Filter bar (search / dropdown / submit) ────────────── */

    form.filter-bar {
      display: flex; gap: 12px; align-items: end; flex-wrap: wrap;
      margin-bottom: 20px;
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    form.filter-bar label { display: flex; flex-direction: column; gap: 6px; }
    form.filter-bar input,
    form.filter-bar select {
      padding: 10px 12px; font-size: 14px;
      background: var(--white);
      border: 1px solid var(--slate-300);
      border-radius: var(--radius-sm);
      color: var(--navy-900);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 200px;
    }
    form.filter-bar input:focus,
    form.filter-bar select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-glow);
    }
    form.filter-bar button {
      padding: 10px 18px; font-size: 14px; font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 100%);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      letter-spacing: 0.01em;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    form.filter-bar button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -6px rgba(15, 23, 42, 0.35);
    }
    form.filter-bar a.clear { color: var(--slate-500); font-size: 13px; align-self: center; }

    .empty {
      padding: 48px; text-align: center;
      color: var(--slate-400);
      background: var(--white);
      border: 1px dashed var(--slate-300);
      border-radius: var(--radius);
      font-size: 15px;
    }

    /* ── Utility ────────────────────────────────────────────── */

    code {
      background: var(--slate-100); color: var(--navy-800);
      padding: 2px 6px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }

    /* ── Mobile nav (topbar + off-canvas drawer) ───────────────
       Sidebar is a fixed 240px flex sibling of .main on desktop — on a
       narrow phone that leaves almost no room for content. Below 768px
       the sidebar becomes a fixed off-canvas drawer (hidden by default,
       toggled via .sidebar-open on <body>) behind a backdrop, and a
       slim topbar with a hamburger button takes its place in flow. */
    .mobile-topbar { display: none; }
    .sidebar-backdrop { display: none; }

    @media (max-width: 768px) {
      .mobile-topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
        position: sticky; top: 0; z-index: 30;
      }
      .mobile-topbar .sidebar-brand { margin-bottom: 0; padding: 0; }
      .mobile-topbar .sidebar-brand .wordmark { font-size: 20px; }
      .mobile-topbar .sidebar-brand svg { width: 26px; height: 26px; }
      .menu-toggle {
        appearance: none; border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.06);
        border-radius: var(--radius-sm);
        width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0;
      }
      .menu-toggle svg { width: 20px; height: 20px; stroke: var(--white); }

      .layout { display: block; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 260px; max-width: 82vw;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        z-index: 50;
        height: 100vh;
        overflow-y: auto;
      }
      body.sidebar-open .sidebar { transform: translateX(0); }
      .sidebar-backdrop {
        display: block;
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.5);
        z-index: 40;
        opacity: 0; pointer-events: none;
        transition: opacity 0.2s ease;
      }
      body.sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
      body.sidebar-open { overflow: hidden; }

      .main { padding: 24px 16px; }
      .page-title { font-size: 26px; }
    }
  </style>
</head>
<body>
<div class="mobile-topbar">
  <div class="sidebar-brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
      <g transform="translate(2, 2) scale(0.95)">
        <path fill="none" stroke="#eab308" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
          d="M15 28 L12 4 L6 4 Q1 4 1 11 Q1 18 6 18 L14 18"/>
        <circle cx="17.5" cy="15" r="1.9" fill="#eab308"/>
        <g transform="rotate(12, 24, 23)">
          <path fill="none" stroke="#f1f5f9" stroke-width="2.6" stroke-linecap="round"
            d="M19 19 L29 28 M29 19 L19 28"/>
        </g>
      </g>
    </svg>
    <span class="wordmark">PrudiX<sup>&trade;</sup></span>
  </div>
  <button type="button" class="menu-toggle" id="sidebarToggle" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <g transform="translate(2, 2) scale(0.95)">
          <path fill="none" stroke="#eab308" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
            d="M15 28 L12 4 L6 4 Q1 4 1 11 Q1 18 6 18 L14 18"/>
          <circle cx="17.5" cy="15" r="1.9" fill="#eab308"/>
          <g transform="rotate(12, 24, 23)">
            <path fill="none" stroke="#f1f5f9" stroke-width="2.6" stroke-linecap="round"
              d="M19 19 L29 28 M29 19 L19 28"/>
          </g>
        </g>
      </svg>
      <span class="wordmark">PrudiX<sup>&trade;</sup></span>
    </div>
    <span class="sidebar-badge">GiftSense admin</span>

    <nav>
      <a href="{{ admin_path }}/" class="{% if active == 'overview' %}active{% endif %}">Overview</a>
      <a href="{{ admin_path }}/financials" class="{% if active == 'financials' %}active{% endif %}">Money</a>
      <a href="{{ admin_path }}/shops" class="{% if active == 'shops' %}active{% endif %}">Shops</a>
      <a href="{{ admin_path }}/models" class="{% if active == 'models' %}active{% endif %}">AI models</a>
      <a href="{{ admin_path }}/support" class="{% if active == 'support' %}active{% endif %}">Support{% if open_count is defined and open_count %} <span class="sidebar-badge">{{ open_count }}</span>{% endif %}</a>
      <a href="{{ admin_path }}/system" class="{% if active == 'system' %}active{% endif %}">System</a>
      {% if sentry_project_url %}
        <a href="{{ sentry_project_url }}" class="external" target="_blank" rel="noopener noreferrer">Errors &nearr;</a>
      {% endif %}
    </nav>

    <footer>
      <form method="post" action="{{ admin_path }}/logout" style="margin:0 0 10px;">
        <button type="submit" style="background:none;border:1px solid var(--slate-500);color:var(--slate-300);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;">Sign out</button>
      </form>
      <span class="env-chip">{{ env }}</span><br>
      <span style="margin-top: 6px; display: inline-block;">generated {{ generated_at }}</span>
    </footer>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script>
  (function () {
    var toggle = document.getElementById('sidebarToggle');
    var backdrop = document.getElementById('sidebarBackdrop');
    if (!toggle || !backdrop) return;

    function setOpen(open) {
      document.body.classList.toggle('sidebar-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    toggle.addEventListener('click', function () {
      setOpen(!document.body.classList.contains('sidebar-open'));
    });
    backdrop.addEventListener('click', function () { setOpen(false); });
    document.querySelectorAll('.sidebar nav a').forEach(function (link) {
      link.addEventListener('click', function () { setOpen(false); });
    });
  })();
</script>
</body>
</html>
